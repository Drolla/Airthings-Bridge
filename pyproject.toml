[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "D"]
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Verbatim copies of the phc logdb module and its tests
"libs/logdb.py" = ["ALL"]
"tests/test_logdb.py" = ["ALL"]
# The Python version is checked before the other modules are imported
"waveplus_bridge.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "unittest_*.py"]
